{% extends "layout.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/editar_usuario.css') }}">

<div class="admin-wrapper">

    <aside class="admin-sidebar">

        <h3 class="admin-logo">Admin</h3>

        <nav class="admin-menu">
            <a href="/entrada" class="admin-link">Acessos</a>
            <a href="/admin" class="admin-link">Dashboard</a>
            <a href="/gerenciar" class="admin-link active">Gerenciar</a>
            <a href="/registros" class="admin-link">Registros</a>

        </nav>

    </aside>

    <main class="admin-content">

        <h2 class="admin-title">
            Editar Usuário
        </h2>

        <div class="card shadow p-4 mb-4">

            <form method="POST"
                  action="/usuario/editar/{{ usuario.id }}"
                  id="formEditarUsuario">

                <input type="hidden"
                       id="imagemCapturada"
                       name="imagemCapturada">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Nome</label>
                        <input type="text"
                               name="nome"
                               id="nome"
                               class="form-control"
                               value="{{ usuario.nome }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               id="email"
                               class="form-control"
                               value="{{ usuario.email }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>CPF</label>
                       <input type="text"
                            class="form-control"
                            value="{{ usuario.cpf_mascarado }}"
                            disabled>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Ano de Nascimento</label>
                        <input type="text"
                               class="form-control"
                               value="{{ usuario.ano_nascimento }}"
                               disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>CEP</label>
                        <input type="text"
                               name="cep"
                               id="cep"
                               class="form-control"
                               value="{{ usuario.cep }}"
                               required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label>Rua</label>
                        <input type="text"
                               name="rua"
                               id="rua"
                               class="form-control"
                               value="{{ usuario.rua }}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Número</label>
                        <input type="text"
                               name="numero"
                               id="numero"
                               class="form-control"
                               value="{{ usuario.numero }}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Bairro</label>
                        <input type="text"
                               name="bairro"
                               id="bairro"
                               class="form-control"
                               value="{{ usuario.bairro }}"
                               required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Cidade</label>
                        <input type="text"
                               name="cidade"
                               id="cidade"
                               class="form-control"
                               value="{{ usuario.cidade }}"
                               required>
                    </div>

                    <div class="col-md-1 mb-3">
                        <label>UF</label>
                        <input type="text"
                               name="estado"
                               id="estado"
                               class="form-control"
                               value="{{ usuario.estado }}"
                               required>
                    </div>

                </div>

                <div class="card shadow p-4 mt-3 mb-4">

                    <h4 class="mb-3">
                        Atualizar Imagem Facial
                    </h4>

                    <div class="camera-container">

                        <video id="video"
                               autoplay
                               playsinline>
                        </video>

                        <canvas id="canvas"
                                width="400"
                                height="400"
                                style="display:none;">
                        </canvas>

                        <img id="previewFoto"
                             style="display:none; width:100%; border-radius:12px;">

                        <p id="statusFoto"
                           class="mt-3">
                            Posicione o rosto para atualizar a imagem.
                        </p>

                        <button id="btnCapturarFoto"
                                type="button"
                                class="btn btn-success">
                            Capturar Nova Imagem
                        </button>

                        <button id="btnTirarOutra"
                                type="button"
                                class="btn btn-warning mt-2"
                                style="display:none;">
                            Tirar Outra
                        </button>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Salvar Alterações
                </button>

                <a href="/gerenciar"
                   class="btn btn-secondary">
                    Voltar
                </a>

            </form>

        </div>

    </main>

</div>

<script>
    const usuarioId = "{{ usuario.id }}";
</script>

<script src="{{ url_for('static', filename='js/editar_usuario.js') }}"></script>

{% endblock %}
