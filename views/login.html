<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-card h3 {
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #084298;
        }

        .link-cadastro {
            font-size: 14px;
        }

        .logo {
            font-size: 40px;
            text-align: center;
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🔐</div>

    <h3 class="text-center">Acesso ao Sistema</h3>

    <form method="POST" action="/login">

        <div class="mb-3">
            <label>Email ou CPF</label>
            <input type="text" name="login" class="form-control" placeholder="Digite seu email ou CPF" required>
        </div>

        <div class="mb-3">
            <label>Senha</label>
            <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
        </div>

        <button class="btn btn-login w-100">Entrar</button>

    </form>

    <p class="mt-3 text-center link-cadastro">
        Não tem cadastro?
        <a href="/">Clique aqui</a>
    </p>

</div>

</body>
</html>
