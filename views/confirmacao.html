<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmação</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #198754, #146c43);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .btn-danger {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="card-box">

    <h2 class="text-success">✅ Presença Confirmada!</h2>

    <p class="mt-3">
        Sua presença no evento foi registrada com sucesso.
    </p>

    <p>
        Caso deseje, você pode solicitar a exclusão dos seus dados conforme a LGPD.
    </p>

    
    <form method="POST" action="/excluir" onsubmit="return confirmarExclusao()">
        <button class="btn btn-danger">Excluir meus dados</button>
    </form>

</div>

<script>
function confirmarExclusao() {
    return confirm("Tem certeza que deseja excluir seus dados? Essa ação não pode ser desfeita.");
}
</script>

</body>
</html>
