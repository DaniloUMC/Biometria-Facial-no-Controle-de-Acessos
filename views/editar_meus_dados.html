<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Alterar Meus Dados</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_meus_dados.css') }}">
</head>

<body>

    <div class="editar-container">

        <div class="editar-card">

            <h2>Alterar Meus Dados</h2>

            <p class="editar-subtitulo">
                Atualize suas informações cadastrais. O CPF não pode ser alterado.
            </p>

            {% if erro %}
                <div class="alerta-erro">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST" action="/meus-dados/salvar">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Nome</label>
                        <input
                            type="text"
                            name="nome"
                            value="{{ usuario.nome }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            value="{{ usuario.email }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>CPF</label>
                        <input
                            type="text"
                            value="{{ usuario.cpf }}"
                            readonly
                        >
                    </div>

                    <div class="form-group">
                        <label>CEP</label>
                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            value="{{ usuario.cep }}"
                            required
                        >
                    </div>

                    <div class="form-group full">
                        <label>Rua</label>
                        <input
                            type="text"
                            id="rua"
                            name="rua"
                            value="{{ usuario.rua }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Número</label>
                        <input
                            type="text"
                            name="numero"
                            value="{{ usuario.numero }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Bairro</label>
                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            value="{{ usuario.bairro }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Cidade</label>
                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            value="{{ usuario.cidade }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            value="{{ usuario.estado }}"
                            maxlength="2"
                            required
                        >
                    </div>

                </div>
                <div class="form-check mt-3" style="padding-top: 20px;">
                    <input
                        type="checkbox"
                        id="intencao_evento"
                        name="intencao_evento"
                        value="1"
                        {% if usuario.intencao_evento == 1 %}checked{% endif %}
                    >

                    <label for="intencao_evento">
                        Confirmo que tenho intenção de participar do evento.
                    </label>
                </div>

                <div class="botoes-editar">

                    <button type="submit" class="btn-salvar">
                        Salvar Alterações
                    </button>

                    <a href="/confirmacao" class="btn-voltar">
                        Voltar
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
